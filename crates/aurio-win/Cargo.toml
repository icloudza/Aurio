[package]
name = "aurio-win"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "aurio-win"
path = "src/main.rs"

[dependencies]
aurio-core = { path = "../aurio-core" }
aurio-tools = { path = "../aurio-tools" }
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
wasapi = "0.26"
mdns-sd = "0.21"
# 在线更新：下载走系统自带的 TLS（schannel），读系统代理设置
aurio-update = { path = "../aurio-update", features = ["client"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Performance", "Win32_System_Com", "Win32_System_Com_Urlmon", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
